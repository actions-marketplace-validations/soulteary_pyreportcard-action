name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: go test -race ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l cmd internal)"
      - run: bash -n scripts/*.sh
      - run: scripts/test-prepare-release.sh
      - name: Install analyzer dependencies
        run: python -m pip install -r scripts/tool-requirements.txt
      - name: Test real analyzers
        run: scripts/integration.sh
        env:
          TOOL_PYTHON: python
      - name: Verify local Action
        uses: ./
        with:
          directory: testdata/clean
          mode: typed
          fail_on: findings
      - name: Generate README badge
        run: scripts/update-badge-example.sh
        env:
          TOOL_PYTHON: python
      - uses: actions/upload-artifact@v4
        with:
          name: pyreportcard-example
          path: .github/pyreportcard-example/
          include-hidden-files: true
