name: CI
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Unit tests and 95% coverage gate
        run: scripts/test-coverage.sh
      - run: go vet ./...
      - run: test -z "$(gofmt -l cmd internal)"
      - run: bash -n scripts/*.sh
      - run: scripts/test-prepare-release.sh
      - name: Install analyzer dependencies
        run: python -m pip install -r scripts/tool-requirements.txt
      - name: Test real analyzers
        run: scripts/integration.sh
        env:
          TOOL_PYTHON: python
      - name: Verify local Action
        uses: ./
        with:
          directory: testdata/clean
          mode: typed
          fail_on: findings
      - name: Generate README badge
        run: scripts/update-badge-example.sh
        env:
          TOOL_PYTHON: python
      - uses: actions/upload-artifact@v4
        with:
          name: pyreportcard-example
          path: .github/pyreportcard-example/
          include-hidden-files: true
      - name: Upload unit-test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage.out
          if-no-files-found: error

  go-report-card:
    name: Go Report Card
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Grade this project's Go code
        uses: soulteary/goreportcard-action@9744d0297ca0116cd4ef83e4ff6f3ba42a65a24d # v1.1.7
        with:
          version: v1.1.7
          directory: .
          output: .github/goreportcard.svg
          report_output: .github/goreportcard-report.md
          report: 'true'
          commit: 'false'
          threshold: '0'
      - name: Upload Go Report Card
        uses: actions/upload-artifact@v4
        with:
          name: go-report-card
          path: |
            .github/goreportcard.svg
            .github/goreportcard-report.md
          include-hidden-files: true
          if-no-files-found: error
  publish-go-report:
    name: Update README Go badge
    needs: go-report-card
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: go-report-writeback
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-report-card
          path: ${{ runner.temp }}/go-report-card
      - name: Commit reports for the tested revision
        env:
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPORT_DIR: ${{ runner.temp }}/go-report-card
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"
          current=$(git rev-parse FETCH_HEAD)
          if [ "$current" != "$SOURCE_SHA" ]; then
            echo "Default branch changed; keeping this report as a CI artifact."
            exit 0
          fi
          git checkout -B "$DEFAULT_BRANCH" "$current"
          test ! -L .github
          for file in goreportcard.svg goreportcard-report.md; do
            test -f "$REPORT_DIR/$file" && test ! -L "$REPORT_DIR/$file"
            test ! -L ".github/$file"
            cp "$REPORT_DIR/$file" ".github/$file"
          done
          git add -- .github/goreportcard.svg .github/goreportcard-report.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update Go Report Card'
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
