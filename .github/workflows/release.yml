name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    # Reusable CI declares a main-only report write-back job. GitHub checks
    # its permission ceiling even when that job is skipped for a release.
    permissions:
      contents: write
    uses: ./.github/workflows/ci.yml
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: Prepare Marketplace release draft
        run: scripts/prepare-release.sh "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
